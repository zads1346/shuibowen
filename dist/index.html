<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#091a23"><title>水镜 · Gesture Water</title><meta name="description" content="用手拨动水面。一个在设备本地运行的摄像头水波互动实验。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230a2330'/%3E%3Cpath d='M5 17q6-10 11 0t11 0M5 23q6-10 11 0t11 0' fill='none' stroke='%2399e5ed' stroke-width='2'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main><canvas id="water" aria-label="互动水面，移动鼠标或手指制造水波"></canvas><video id="camera" playsinline muted hidden></video><div class="shade"></div><header><div class="brand"><span class="mark">≈</span><div><h1>水镜</h1><span>GESTURE / WATER</span></div></div><button id="settingsButton" class="round" aria-label="调整水面" aria-expanded="false">☷</button></header><section id="intro"><span class="eyebrow">一个手势，一场涟漪</span><h2>把自己<br>置于水中。</h2><p>打开镜头，用手轻轻拨动水面。<br>也可以先用鼠标或手指试一试。</p><button id="start" class="primary"><span class="cameraIcon"></span>开启摄像头</button><p class="privacy">画面仅在本机处理 · 不上传，不录制</p></section><aside id="settings" hidden><div class="panelTitle">水面调节<button id="closeSettings" aria-label="关闭设置">×</button></div><label for="strength">水纹强度 <output id="strengthValue">65</output></label><input id="strength" type="range" min="10" max="100" value="65"><label for="recovery">恢复速度 <output id="recoveryValue">50</output></label><input id="recovery" type="range" min="0" max="100" value="50"><label class="check"><span>镜像画面</span><input id="mirror" type="checkbox" checked></label><label for="facing">摄像头</label><select id="facing"><option value="user">前置镜头</option><option value="environment">后置镜头</option></select><button id="clear">平静水面</button><button id="stop" hidden>关闭摄像头</button><small>手势模型在设备本地运行。模型不可用时，仍可触摸或拖动水面。</small></aside><footer><div><span id="mode">演示水面</span><span id="status" role="status" aria-live="polite">移动鼠标 / 触摸水面</span></div><button id="reopen" hidden>开启摄像头</button><button id="fullscreen" aria-label="全屏">⛶</button></footer><div id="error" role="alert" hidden></div></main><script type="module" src="app.js"></script></body></html>
